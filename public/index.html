<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ALYZIA OPS</title>
    <style>
      :root {
        color: #eef6ff;
        background: #07111f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #163e63 0, transparent 45%),
          #07111f;
      }

      main {
        width: min(38rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #2c5878;
        border-radius: 1.25rem;
        background: rgb(8 24 41 / 88%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
      }

      p {
        color: #a9c3d7;
        line-height: 1.6;
      }

      code {
        color: #81d4fa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ALYZIA OPS</h1>
      <p>Fondation Cloudflare Workers + D1 — version 0.1.0.</p>
      <p>État du service : <code>GET /api/health</code></p>
    </main>
  </body>
</html>
